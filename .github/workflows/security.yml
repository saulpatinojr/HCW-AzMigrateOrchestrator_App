# PIN-BY-SHA: actions are pinned by version tag in this build because commit SHAs could not be verified offline.
# Replace each @vX.Y.Z with its commit SHA (e.g. via pinact or dependabot) before enabling branch protection on CI — VALIDATION.md.
name: security
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "17 6 * * 1" }]
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/dependency-review-action@v4.5.0
        with: { fail-on-severity: moderate }
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: github/codeql-action/init@v3.29.2
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3.29.2
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
