# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
name: iac-validate
on:
  pull_request:
    paths: ["infrastructure/terraform/**", ".github/workflows/iac-validate.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/terraform/**"]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infrastructure/terraform/appliance-azure]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=${{ matrix.dir }} fmt -recursive -check -diff
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.dir }} validate -no-color
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: "${{ matrix.dir }}", exit-code: "1", severity: "HIGH,CRITICAL" }
