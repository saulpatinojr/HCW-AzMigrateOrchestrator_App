# Lets the GitHub Copilot coding agent build and test this repository in its ephemeral environment.
name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]
permissions:
  contents: read
env:
  ADDON_REF: v0.1.2
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: HCW-AzMigrateOrchestrator_App } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: HCW-AzMigrateOrchestrator_App }
      - name: Check out the shared core at the pinned ref (ADR-0027 interim contract)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: saulpatinojr/HCW-AzMigrateOrchestrator_Addon, ref: "${{ env.ADDON_REF }}", path: HCW-AzMigrateOrchestrator_Addon }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: "HCW-AzMigrateOrchestrator_*/package-lock.json" }
      - run: npm ci && npm run build
        working-directory: HCW-AzMigrateOrchestrator_Addon
      - run: npm ci
      - run: npm run build
