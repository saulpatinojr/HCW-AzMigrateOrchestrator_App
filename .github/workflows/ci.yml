# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run rules:validate
      - name: Build appliance web (Vite + Tailwind)
        run: npm run web:build
        env: { VITE_ENTRA_TENANT_ID: ci, VITE_ENTRA_SPA_CLIENT_ID: ci, VITE_API_SCOPE: ci }
      - name: Package repository ZIP (artifact)
        run: bash scripts/package-repository.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: hcw-azmigrateorchestrator-app, path: hcw-azmigrateorchestrator-app.zip, retention-days: 7 }

  packed-consumer:
    # The packages the web-front edition and the website install: pack, install from tarballs into an empty project, run, type-check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: node scripts/verify-packed-consumer.mjs

  generated-terraform:
    # Proves the generated bundle (not just the repo's own IaC) passes terraform validate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: node apps/cli/dist/main.js assess --csv samples/resources-csv/sample-resources.csv --out ./out --region westus3
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=out/terraform fmt -recursive   # generated code is normalized, then must validate
      - run: terraform -chdir=out/terraform init -backend=false -input=false
      - run: terraform -chdir=out/terraform validate -no-color
      - run: terraform -chdir=out/terraform/hcp init -backend=false -input=false && terraform -chdir=out/terraform/hcp validate -no-color
      - name: Check generated arguments against the real provider schema
        run: |
          terraform -chdir=out/terraform providers schema -json > /tmp/schema.json
          node scripts/check-generated-arguments.mjs out/terraform/argument-manifest.json /tmp/schema.json
