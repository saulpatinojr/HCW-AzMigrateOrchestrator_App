# PIN-BY-SHA: actions pinned by version tag in this build; convert to commit SHAs before relying on this as a release gate — VALIDATION.md.
# Build context is the workspace root holding both checkouts (ADR-0027). Deployments must reference the published digest, never a tag.
name: publish-images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
env:
  ADDON_REF: v0.1.0
  IMAGE: ghcr.io/${{ github.repository_owner }}/azure-migration-orchestrator-appliance
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with: { path: HCW-AzMigrateOrchestrator_App }
      - name: Check out the shared core at the pinned ref (ADR-0027 interim contract)
        uses: actions/checkout@v4.2.2
        with: { repository: saulpatinojr/HCW-AzMigrateOrchestrator_Addon, ref: "${{ env.ADDON_REF }}", path: HCW-AzMigrateOrchestrator_Addon }
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: HCW-AzMigrateOrchestrator_App/infrastructure/docker/Dockerfile.appliance
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2.2.3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
