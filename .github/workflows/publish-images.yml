# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Build context is the workspace root holding both checkouts (ADR-0027). Deployments must reference the published digest, never a tag.
name: publish-images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
env:
  ADDON_REF: v0.1.0
  IMAGE: ghcr.io/${{ github.repository_owner }}/azure-migration-orchestrator-appliance
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: HCW-AzMigrateOrchestrator_App }
      - name: Check out the shared core at the pinned ref (ADR-0027 interim contract)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: saulpatinojr/HCW-AzMigrateOrchestrator_Addon, ref: "${{ env.ADDON_REF }}", path: HCW-AzMigrateOrchestrator_Addon }
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: HCW-AzMigrateOrchestrator_App/infrastructure/docker/Dockerfile.appliance
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
