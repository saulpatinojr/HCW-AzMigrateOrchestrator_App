# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Builds the single-executable `amo` CLI (Node SEA) for Linux, macOS and Windows on tags and attaches binaries + checksums to the release.
name: release-cli
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  sea:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: bash scripts/build-sea.sh
        shell: bash
      - name: Smoke test (the one binary; checksum files are skipped)
        shell: bash
        run: |
          set -euo pipefail
          for b in dist-sea/amo-*; do
            case "$b" in *.txt) continue ;; esac
            echo "running $b"
            "$b" rules validate
            "$b" assess --csv samples/resources-csv/sample-resources.csv --out "$RUNNER_TEMP/smoke" --region westus3 > /dev/null
            test -f "$RUNNER_TEMP/smoke/reports/resource-decisions.csv"
          done
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist-sea/amo-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amo-${{ matrix.os }}
          path: dist-sea/*
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-sea/*
